<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- 占位图：把微信/支付宝收款码截图命名为 pay-qr.png 放进 images 文件夹，
       然后把 index.html 里的 images/pay-qr.svg 改成 images/pay-qr.png -->
  <rect x="1.5" y="1.5" width="237" height="237" fill="#F7F5F1" stroke="#D8D3C9" stroke-width="2" stroke-dasharray="9 7"/>
  <g font-family="PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" text-anchor="middle">
    <text x="120" y="96" font-size="16" fill="#8C8378">把收款码</text>
    <text x="120" y="122" font-size="16" fill="#8C8378">截图放这里</text>
    <text x="120" y="158" font-size="11.5" fill="#A63A2A">images/pay-qr.png</text>
  </g>
</svg>
